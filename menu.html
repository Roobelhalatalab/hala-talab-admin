<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b00" />
  <meta name="description" content="المنيو الإلكتروني لمتاجر هلا طلب" />
  <title>المنيو الإلكتروني | هلا طلب</title>
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="./menu.css?v=47" />
</head>
<body>
  <div class="menu-app" id="menuApp">
    <header class="public-topbar">
      <a class="hala-brand" href="./menu.html" aria-label="هلا طلب">
        <span class="hala-logo">هـ</span>
        <span><strong>هلا طلب</strong><small>المنيو الإلكتروني</small></span>
      </a>
      <div class="topbar-actions">
        <button id="copyMenuBtn" class="ghost-btn" type="button" hidden>نسخ الرابط</button>
        <button id="qrMenuBtn" class="ghost-btn" type="button" hidden>QR</button>
        <button id="shareMenuBtn" class="ghost-btn" type="button" hidden>مشاركة</button>
      </div>
    </header>

    <main id="menuContent" class="menu-content" aria-live="polite">
      <section class="loading-card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>جارٍ تحميل المنيو...</h1>
        <p>لحظات ونجهز لك أقسام المطعم.</p>
      </section>
    </main>

    <footer class="public-footer">
      <span>منيو إلكتروني بواسطة</span>
      <strong>هلا طلب</strong>
    </footer>
  </div>

  <div id="qrModal" class="qr-modal" hidden>
    <div class="qr-backdrop" data-close-qr></div>
    <section class="qr-dialog" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
      <button class="qr-close" type="button" data-close-qr aria-label="إغلاق">×</button>
      <div class="qr-dialog-head">
        <span class="qr-icon">▦</span>
        <div><h2 id="qrTitle">QR المنيو</h2><p id="qrStoreName"></p></div>
      </div>
      <div class="qr-image-wrap"><img id="qrImage" alt="QR المنيو" /></div>
      <label class="qr-link-label">رابط المنيو</label>
      <div class="qr-link-row"><input id="qrLink" readonly /><button id="qrCopyBtn" class="ghost-btn" type="button">نسخ</button></div>
      <div class="qr-actions">
        <button id="qrPrintBtn" class="primary-btn" type="button">طباعة QR</button>
        <button id="qrOpenBtn" class="ghost-btn" type="button">فتح صورة QR</button>
      </div>
    </section>
  </div>

  <div id="ratingModal" class="rating-modal" hidden>
    <div class="rating-backdrop" data-close-rating></div>
    <section class="rating-dialog" role="dialog" aria-modal="true" aria-labelledby="ratingTitle">
      <button class="qr-close" type="button" data-close-rating aria-label="إغلاق">×</button>
      <h2 id="ratingTitle">إضافة تقييم</h2>
      <p id="ratingSubtitle" class="muted"></p>
      <div class="stars-input" id="ratingStars" aria-label="اختر التقييم من 1 إلى 5"></div>
      <label class="field-label">الاسم <span>اختياري</span>
        <input id="ratingName" type="text" maxlength="60" placeholder="اسمك" autocomplete="name" />
      </label>
      <label class="field-label">التعليق <span>اختياري</span>
        <textarea id="ratingComment" rows="4" maxlength="500" placeholder="اكتب رأيك باختصار..."></textarea>
      </label>
      <div id="ratingMessage"></div>
      <button id="ratingSubmit" class="primary-btn wide" type="button">إرسال التقييم</button>
    </section>
  </div>

  <script type="module" src="./menu.js?v=47"></script>
</body>
</html>
