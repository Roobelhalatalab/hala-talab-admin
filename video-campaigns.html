<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حملات الفيديو | هلا طلب</title><style>body{font:15px system-ui;background:#f7f7f8;color:#222;margin:0;padding:20px}main{max-width:850px;margin:auto}section{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:16px 0}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:9px;border-radius:8px;border:1px solid #bbb;max-width:100%;box-sizing:border-box}input:not([type=checkbox]),select{width:100%}button{background:#ee7800;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:right}#status{white-space:pre-wrap}small{color:#666}</style></head><body><main><p><a href="./index.html">العودة إلى لوحة الإدارة</a></p><h1>إعلانات الفيديو الترويجية</h1><p id="status">جاري التحقق من صلاحية الإدارة…</p><section id="panel" hidden><h2>حملة جديدة</h2><form id="form"><label>عنوان الحملة<input id="title" maxlength="160" required></label><label>ملف فيديو MP4 (حتى 20 ميغابايت)<input id="file" type="file" accept="video/mp4" required></label><label>تاريخ ووقت البداية<input id="start" type="datetime-local" required></label><label>تاريخ ووقت النهاية<input id="end" type="datetime-local" required></label><label>معرّف المتجر (UUID) إن كان مرتبطاً<input id="store" placeholder="اختياري"></label><label>الرابط الخارجي (HTTPS) إن وجد<input id="url" type="url" placeholder="https://..."></label><label><input id="active" type="checkbox" checked> تفعيل الحملة</label><button id="save" type="submit">رفع الفيديو وحفظ الحملة</button></form><small>عند وجود رابط خارجي ومتجر، تكون أولوية الضغط للرابط الخارجي. هذه الشاشة لا تحذف الملفات تلقائياً.</small></section><section id="listPanel" hidden><h2>الحملات المسجلة</h2><div style="overflow:auto"><table><thead><tr><th>العنوان</th><th>البداية</th><th>النهاية</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module" src="./video-campaigns.js"></script></body></html>
