<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تخصيص سائقي هلا طلب</title><style>body{font-family:system-ui;background:#fff7ef;color:#30251b;margin:0;padding:24px}main{max-width:720px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 5px 25px #0001}label{display:block;margin:18px 0 6px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:9px;direction:ltr}.choices{max-height:270px;overflow:auto;border:1px solid #ddd;border-radius:10px;padding:10px}.choices label{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:400}.choices input{width:auto}select{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px}button{background:#f77c12;color:white;border:0;border-radius:9px;padding:12px 20px;margin-top:18px;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;line-height:1.8}a{color:#a04b00}</style></head><body><main><a href="./">← العودة للإدارة</a><h1>تخصيص سائقي هلا طلب</h1><p>ربط السائق بعدة متاجر ومناطق. لا يؤثر على نظام سائقي المتاجر القديم.</p><div id="auth">جارٍ التحقق من صلاحية الإدارة…</div><form id="form" hidden><label for="driver">السائق</label><select id="driver" required></select><label for="stores">المطاعم والمتاجر (يمكن اختيار أي عدد)</label><input id="storeSearch" placeholder="ابحث عن اسم المتجر" autocomplete="off"><div id="stores" class="choices"></div><label>مناطق التوصيل</label><div id="areas" class="choices"></div><label><input id="active" type="checkbox" checked style="width:auto"> تفعيل التخصيص</label><button id="save">حفظ التخصيصات</button></form><p id="status" role="status"></p></main><script type="module">
import {supabase,verifyAdmin} from './supabase.js';
import {assignHalaDriverToStores} from './hala_driver_dispatch_stage12.js';
const auth=document.getElementById('auth'), form=document.getElementById('form'), status=document.getElementById('status');
const selectedStores=new Set();

const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
let storeRows=[];
async function loadAll(table,columns='*'){
 const rows=[];for(let offset=0;offset<10000;offset+=500){const {data,error}=await supabase.from(table).select(columns).range(offset,offset+499);if(error)throw error;rows.push(...(data||[]));if((data||[]).length<500)break;}return rows;
}
async function loadOptions(){
 try{
  const [profiles,stores,areas]=await Promise.all([loadAll('partner_profiles'),loadAll('stores'),loadAll('hala_zone_areas','id,name,is_active')]);
  const drivers=profiles.filter(x=>String(x.partner_type||x.role||'').toLowerCase()==='driver'&&uuid.test(String(x.id)));
  document.getElementById('driver').innerHTML='<option value="">اختر السائق</option>'+drivers.map(d=>`<option value="${escapeHtml(d.id)}">${escapeHtml(d.full_name||d.name||d.phone||d.id)} — ${escapeHtml(d.phone||'')}</option>`).join('');
  storeRows=stores.filter(x=>uuid.test(String(x.id)));
  const selected=areas.filter(x=>/كرم|كارمل|برطل/i.test(String(x.name||'')) && x.is_active!==false);
  document.getElementById('areas').innerHTML=selected.map(a=>`<label><input type="checkbox" value="${escapeHtml(a.id)}">${escapeHtml(a.name)}</label>`).join('')||'لم تظهر منطقتا كرمليس وبرطلة. لا يمكن الحفظ.';
  renderStores();
 }catch(e){status.textContent='تعذّر تحميل أسماء السائقين أو المتاجر أو المناطق: '+e.message;form.querySelector('button').disabled=true;}
}
function renderStores(){const query=document.getElementById('storeSearch').value.trim().toLowerCase();const container=document.getElementById('stores');const previous=selectedStores;container.innerHTML=storeRows.filter(s=>String(s.name||s.store_name||'').toLowerCase().includes(query)).map(s=>`<label><input type="checkbox" value="${escapeHtml(s.id)}" ${previous.has(String(s.id))?'checked':''}>${escapeHtml(s.name||s.store_name||s.id)}</label>`).join('')||'لا توجد متاجر مطابقة';}
document.getElementById('storeSearch').addEventListener('input',renderStores);
document.getElementById('stores').addEventListener('change',e=>{if(e.target.matches('input[type=checkbox]')){if(e.target.checked)selectedStores.add(e.target.value);else selectedStores.delete(e.target.value);}});
form.addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('save');const areaIds=[...document.querySelectorAll('#areas input:checked')].map(x=>x.value);if(!selectedStores.size||!areaIds.length){status.textContent='اختر متجراً واحداً على الأقل ومنطقة واحدة على الأقل.';return;}btn.disabled=true;status.textContent='جارٍ حفظ التخصيصات…';try{const done=await assignHalaDriverToStores(supabase,{driverId:document.getElementById('driver').value,storeIds:[...selectedStores],areaIds,active:document.getElementById('active').checked});status.textContent=`تم حفظ ${done.length} تخصيص بنجاح.`;}catch(err){status.textContent=`تعذر الحفظ: ${err.message}\nالتخصيصات المكتملة قبل الخطأ: ${err.completedAssignments?.length||0}. لا تعاود الحفظ قبل المراجعة.`;}finally{btn.disabled=false;}});

try { const {data:{user},error}=await supabase.auth.getUser(); if(error||!user||!(await verifyAdmin(user))){auth.textContent='ليس لديك جلسة إدارة مصرح بها. سجّل الدخول من الصفحة الرئيسية.';}else{auth.textContent='تم التحقق من صلاحية الإدارة.';form.hidden=false;await loadOptions();} } catch(e){auth.textContent='تعذّر التحقق من صلاحية الإدارة.';form.hidden=true;}
</script></body></html>
